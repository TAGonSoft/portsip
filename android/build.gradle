group = "com.tagonsoft.portsip"
version = "1.0-SNAPSHOT"

// The PortSIP VoIP SDK AAR is NOT bundled with this plugin.
// It must be provided by the consuming app at: android/app/libs/portsipvoipsdk.aar
// See the README for setup instructions.

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs "${project.rootProject.projectDir}/app/libs"
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.tagonsoft.portsip"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // compileOnly makes the SDK classes available at compile time for this plugin,
        // but does NOT include the AAR in the plugin's output. The consuming app must
        // add the AAR as an implementation dependency in their own build.gradle.
        compileOnly(name: 'portsipvoipsdk', ext: 'aar')
    }
}

// Validate that the SDK AAR exists in the consuming app's libs directory.
gradle.projectsEvaluated {
    def appLibsDir = file("${project.rootProject.projectDir}/app/libs")
    def sdkJar = new File(appLibsDir, "portsipvoipsdk.aar")

    if (!sdkJar.exists()) {
        logger.warn("""
════════════════════════════════════════════════════════════════════════════════
WARNING: PortSIP VoIP SDK AAR not found!

The portsip plugin requires the PortSIP VoIP SDK AAR to be placed at:

  android/app/libs/portsipvoipsdk.aar

Download the SDK from:
  https://www.portsip.com/download-portsip-voip-sdk/

Then copy portsipvoipsdk.aar to your app's android/app/libs/ directory
and add it as a dependency in your app's build.gradle.

The build will FAIL if the AAR is not present.
════════════════════════════════════════════════════════════════════════════════
""")
    }
}
